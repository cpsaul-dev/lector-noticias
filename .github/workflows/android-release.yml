name: Android CI & Signed Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag opcional para publicar GitHub Release (ej. v0.1.0)'
        required: false
        default: ''

permissions:
  contents: write
  packages: read

jobs:
  build-and-sign:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests and Android Lint
        env:
          GITHUB_TOKEN: ${{ secrets.CONECTOR_IA_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain

      - name: Decode release keystore
        if: github.event_name != 'pull_request'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pulso-release.jks"
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/pulso-release.jks" >> "$GITHUB_ENV"
          fi

      - name: Build signed Release APK
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.CONECTOR_IA_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --no-daemon --console=plain

      - name: Clean up temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/pulso-release.jks"

      - name: Upload Release APK and R8 mapping artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: pulso-release-apk
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
          retention-days: 30

      - name: Publish GitHub Release with signed APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.release_tag }}
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          MAPPING_FILE="app/build/outputs/mapping/release/mapping.txt"
          ASSETS=("$APK_FILE")
          if [ -f "$MAPPING_FILE" ]; then
            ASSETS+=("$MAPPING_FILE")
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "Pulso $RELEASE_TAG" \
              --generate-notes
          fi
